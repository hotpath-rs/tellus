name: hotpath relay

on:
  workflow_run:
    workflows: ["Profile"]
    types: [completed]

jobs:
  relay-profile:
    uses: hotpath-rs/hotpath/.github/workflows/hotpath-relay.yml@f8724d1e001c8a7f8ab805c26627a4fa0f9407f6 # v0.30.1
    permissions:
      actions: read
      id-token: write
      pull-requests: read
    with:
      benchmark: profile
      artifact_name: hotpath-report-profile
      report_file: report.json

  relay-profile-persistence:
    uses: hotpath-rs/hotpath/.github/workflows/hotpath-relay.yml@f8724d1e001c8a7f8ab805c26627a4fa0f9407f6 # v0.30.1
    permissions:
      actions: read
      id-token: write
      pull-requests: read
    with:
      benchmark: profile_persistence
      artifact_name: hotpath-report-profile_persistence
      report_file: report.json
