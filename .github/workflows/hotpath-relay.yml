name: hotpath relay

on:
  workflow_run:
    workflows: ["Profile"]
    types: [completed]

jobs:
  relay-profile:
    uses: hotpath-rs/hotpath/.github/workflows/hotpath-relay.yml@2ee4ef4ba17bdf79a73d4c07d4cd8d0bbda66df5 # v0.28.7
    permissions:
      actions: read
      id-token: write
      pull-requests: read
    with:
      benchmark: profile
      artifact_name: hotpath-report-profile
      report_file: report.json

  relay-profile-persistence:
    uses: hotpath-rs/hotpath/.github/workflows/hotpath-relay.yml@2ee4ef4ba17bdf79a73d4c07d4cd8d0bbda66df5 # v0.28.7
    permissions:
      actions: read
      id-token: write
      pull-requests: read
    with:
      benchmark: profile_persistence
      artifact_name: hotpath-report-profile_persistence
      report_file: report.json
