[package]
name          = "tellus"
description   = "An actor framework for Rust: typed messages, supervision trees, death watch, event sourcing."
version       = "0.3.7"
edition       = { workspace = true }
license       = { workspace = true }
readme        = "README.md"
homepage      = { workspace = true }
repository    = { workspace = true }
documentation = "https://docs.rs/tellus/latest/tellus/"
keywords      = [ "actor", "actors", "actor-model", "supervision", "event-sourcing" ]
categories    = [ "concurrency", "asynchronous" ]
publish       = true

[package.metadata.docs.rs]
all-features = true

[features]
hotpath               = [ "dep:hotpath", "hotpath/hotpath" ]
hotpath-alloc         = [ "hotpath", "hotpath/hotpath-alloc" ]
hotpath-cloud         = [ "hotpath", "hotpath/hotpath-cloud" ]
persistence           = [ "dep:ciborium", "dep:serde", "dep:serde_json", "dep:trait-variant" ]
persistence-in-memory = [ "persistence" ]
persistence-tests     = [ "persistence" ]
serde                 = [ "dep:humantime-serde", "dep:serde" ]
test-util             = [  ]

[dependencies]
ciborium        = { workspace = true, optional = true }
derive_more     = { workspace = true, features = [ "debug", "display", "into" ] }
flume           = { workspace = true, features = [ "async" ] }
hotpath         = { workspace = true, optional = true }
humantime-serde = { workspace = true, optional = true }
serde           = { workspace = true, features = [ "derive" ], optional = true }
serde_json      = { workspace = true, optional = true }
thiserror       = { workspace = true }
tokio           = { workspace = true, features = [ "macros", "rt", "sync", "time" ] }
tracing         = { workspace = true }
trait-variant   = { workspace = true, optional = true }
uuid            = { workspace = true, features = [ "v7" ] }

[dev-dependencies]
anyhow             = { workspace = true }
config             = { workspace = true, features = [ "toml" ] }
criterion          = { workspace = true, features = [ "async_tokio" ] }
serde              = { workspace = true, features = [ "derive" ] }
serde_json         = { workspace = true }
tracing-subscriber = { workspace = true, features = [ "env-filter", "fmt", "json" ] }
tokio              = { workspace = true, features = [ "macros", "rt-multi-thread", "test-util", "time" ] }

[[example]]
name = "getting_started_01_hello"
path = "examples/tutorials/getting_started/01_hello.rs"

[[example]]
name = "getting_started_02_device"
path = "examples/tutorials/getting_started/02_device.rs"

[[example]]
name = "getting_started_03_group"
path = "examples/tutorials/getting_started/03_group.rs"

[[example]]
name = "getting_started_04_watch"
path = "examples/tutorials/getting_started/04_watch.rs"

[[example]]
name = "getting_started_05_query"
path = "examples/tutorials/getting_started/05_query.rs"

[[example]]
name = "getting_started_06_supervision"
path = "examples/tutorials/getting_started/06_supervision.rs"

[[example]]
name = "getting_started_07_device_manager"
path = "examples/tutorials/getting_started/07_device_manager.rs"

[[example]]
name              = "event_sourced_01_device"
path              = "examples/tutorials/event_sourced/01_device.rs"
required-features = [ "persistence-in-memory" ]

[[example]]
name              = "event_sourced_02_supervision"
path              = "examples/tutorials/event_sourced/02_supervision.rs"
required-features = [ "persistence-in-memory" ]

[[example]]
name              = "event_sourced_03_snapshots"
path              = "examples/tutorials/event_sourced/03_snapshots.rs"
required-features = [ "persistence-in-memory" ]

[[example]]
name = "how_to_call_async_code"
path = "examples/how_to/call_async_code.rs"

[[example]]
name              = "how_to_configure_supervision"
path              = "examples/how_to/configure_supervision.rs"
required-features = [ "serde" ]

[[example]]
name = "explanation_state_machine"
path = "examples/explanation/state_machine.rs"

[[example]]
name              = "profile"
required-features = [ "hotpath" ]

[[example]]
name              = "profile_persistence"
required-features = [ "hotpath", "persistence", "persistence-in-memory" ]

[[bench]]
name    = "messaging"
harness = false

[[bench]]
name              = "persistence"
harness           = false
required-features = [ "persistence", "persistence-in-memory" ]
